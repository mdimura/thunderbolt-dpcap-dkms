PACKAGE_NAME="thunderbolt-dpcap"
PACKAGE_VERSION="1.0"
# Fetch drivers/thunderbolt for the exact Arch kernel being built for, apply dp_max_bw.patch
PRE_BUILD="fetch-src.sh ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src modules"
BUILT_MODULE_NAME[0]="thunderbolt"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/thunderbolt"
AUTOINSTALL="yes"
